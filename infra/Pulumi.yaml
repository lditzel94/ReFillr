name: refillr-infra
description: Cloudflare Pages and Supabase for ReFillr
# Pinned so this project always uses Pulumi Cloud, whatever backend the CLI is logged into for
# other projects on the same machine.
backend:
  url: https://api.pulumi.com
runtime:
  name: nodejs
  options:
    packagemanager: npm
# Supabase has no native Pulumi provider: its Terraform provider is bridged, and `pulumi install`
# generates the Node SDK into sdks/supabase (git-ignored), linked as @pulumi/supabase.
packages:
  supabase:
    source: terraform-provider
    version: 1.5.1
    parameters:
      - supabase/supabase
      - 1.11.1
