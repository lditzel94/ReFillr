# Build and test on every push and pull request. Pushes to main then apply the database
# migrations to Supabase and deploy the app to Cloudflare Pages. Pull requests are not deployed
# (docs/adr/0002-no-preview-deploys.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a PR supersedes the run in progress. Runs on main queue up instead, so a
# migration is never cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # the Angular 22 CLI needs 22.22.3+ or 24.15+
          cache: npm
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/refillr/browser
          retention-days: 7

  # The Pulumi program only has to compile here; `pulumi up` runs by hand against Pulumi Cloud.
  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      # `pulumi install` needs no account; a local backend keeps it from asking for a login.
      PULUMI_BACKEND_URL: file://${{ github.workspace }}/.pulumi-local
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: pulumi/actions@v6 # installs the CLI only, since no command is given
      - run: pulumi install # generates the Supabase SDK in sdks/, then npm install
      - run: npm run typecheck

  # Applies the migrations to a throwaway Supabase in Docker and runs the pgTAP tests in
  # supabase/tests, so a broken schema or access rule fails here and never reaches production.
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase db start
      - run: npx supabase test db

  # main only: applies new migrations to the production database before the app that needs them
  # is deployed. The secrets live in the `production` environment.
  migrate:
    needs: [build, db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Created by the Pulumi program in infra/ (output supabaseUrl). Not a secret: it is in the
      # app's Supabase URL.
      SUPABASE_PROJECT_REF: bdzlldteahgdfovbhcgg
    steps:
      - name: Check Supabase credentials
        id: creds
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD are not set; skipping the migrations."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ok == 'true'
      # Without --remote, db push targets the local database. Only migrations not yet recorded in
      # the remote history are applied.
      - run: npx supabase db push --remote="$SUPABASE_PROJECT_REF" --password="$SUPABASE_DB_PASSWORD" --skip-vault --yes
        if: steps.creds.outputs.ok == 'true'

  deploy:
    needs: [build, migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The Cloudflare secrets live in the `production` GitHub environment (only main may use it).
    environment:
      name: production
      url: https://refillr.pages.dev
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Created by the Pulumi program in infra/, not here.
      PROJECT: refillr
      WRANGLER_OUTPUT_FILE_PATH: ${{ github.workspace }}/wrangler-output.jsonl
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Wrangler comes from package-lock.json, the same version used locally.
      - uses: actions/checkout@v5
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/download-artifact@v8
        if: steps.creds.outputs.ok == 'true'
        with:
          name: site
          path: site

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ok == 'true'
        run: |
          # --commit-dirty: the downloaded build sits untracked inside the checkout.
          npx wrangler pages deploy site --project-name="$PROJECT" --branch=main --commit-dirty=true
          url=$(jq -r 'select(.type == "pages-deploy-detailed") | .url' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          {
            echo "### Cloudflare Pages (production)"
            echo ""
            echo "- Site: https://refillr.pages.dev"
            echo "- This deploy: $url"
          } >> "$GITHUB_STEP_SUMMARY"
