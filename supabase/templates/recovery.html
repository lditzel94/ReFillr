<!doctype html>
<html lang="es">
  <body style="margin:0;padding:32px 16px;background:#161826;font-family:Inter,Arial,sans-serif;color:#e9e9ed">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#232532;border-radius:16px;padding:28px">
            <tr><td style="font-size:14px;letter-spacing:0.08em;color:#b5abfc;padding-bottom:18px">ReFillr</td></tr>
            <tr><td style="font-size:22px;font-weight:500;padding-bottom:10px">Elegí una contraseña nueva</td></tr>
            <tr><td style="font-size:15px;line-height:1.5;color:#9397ab;padding-bottom:24px">Pediste cambiar la contraseña de tu cuenta de ReFillr. El link sirve una sola vez.</td></tr>
            <tr>
              <td>
                <a href="{{ .SiteURL }}/set-password?token_hash={{ .TokenHash }}&amp;type=recovery"
                   style="display:inline-block;background:#9184d9;color:#0f111c;text-decoration:none;font-weight:600;font-size:15px;padding:13px 22px;border-radius:12px">Cambiar contraseña</a>
              </td>
            </tr>
            <tr><td style="font-size:12px;line-height:1.5;color:#75798c;padding-top:24px">Si no lo pediste vos, ignoralo: tu contraseña no cambia.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
